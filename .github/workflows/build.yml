name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same ref makes the running build irrelevant. Tags are never cancelled —
# a release build must always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches ~/.gradle, which matters a lot here: the IntelliJ Platform dependency is well
      # over a gigabyte and would otherwise be re-downloaded on every run.
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          base=$(grep -E '^pluginVersion=' gradle.properties | cut -d= -f2)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            # Build number keeps main artifacts distinguishable and ordered.
            version="${base}-main.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Verify & build
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PpluginVersion=${{ steps.version.outputs.version }}
          devCheck verifyPlugin buildPlugin

      - name: Upload plugin zip
        uses: actions/upload-artifact@v4
        with:
          name: localize-plugin-${{ steps.version.outputs.version }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 90

  # ── Release jobs: tags only ────────────────────────────────────────────────
  # Pushes to main are verified but never published. Independent jobs so a failure in one is
  # re-runnable on its own without redoing the other.

  github-release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: localize-plugin-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update release
        run: |
          set -euo pipefail
          # Idempotent so re-running a tag's workflow is safe — `create` fails if the release
          # already exists, which would block re-running the Marketplace job beside it.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} exists — replacing its asset."
            gh release upload "v${VERSION}" dist/*.zip --clobber
          else
            gh release create "v${VERSION}" dist/*.zip \
              --title "v${VERSION}" \
              --generate-notes
          fi

  marketplace:
    name: JetBrains Marketplace
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
    steps:
      - name: Require the publish token
        run: |
          if [[ -z "${PUBLISH_TOKEN}" ]]; then
            echo "::error::PUBLISH_TOKEN secret is not set. Create a token at" \
                 "https://plugins.jetbrains.com/author/me/tokens and add it under" \
                 "Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Rebuilds from the same commit the build job verified. publishPlugin uploads the
      # distribution it produces, so it has to run from the project rather than from a zip.
      - name: Publish
        run: >-
          ./gradlew --no-daemon --stacktrace
          -PpluginVersion=${{ needs.build.outputs.version }}
          publishPlugin
